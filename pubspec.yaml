name: averroes_student_app
description: Averroes International School Student App
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: '>=3.0.5 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  get: ^4.6.6
  sizer: ^2.0.15
  intl: ^0.19.0
  shared_preferences: ^2.3.3
  # Secure storage for the login token (Keychain on iOS / Keystore on Android)
  # — required so the token is never kept in plain SharedPreferences.
  flutter_secure_storage: ^9.2.2
  flutter_svg: ^2.0.4
  dots_indicator: ^2.1.0
  nb_utils: ^7.3.5
  table_calendar: ^3.0.9
  fluttertoast: ^9.1.0
  connectivity_plus: ^7.1.1
  http: ^1.2.2
  google_maps_flutter: ^2.6.1
  image_picker: ^1.1.2
  app_links: ^6.3.4
  path_provider: ^2.1.6
  path: ^1.9.0
  open_filex: ^4.7.0
  url_launcher: ^6.3.2
  flutter_staggered_grid_view: ^0.7.0
  webview_flutter: ^4.14.0

  # ── Driver Transport feature-এর জন্য নতুন যোগ করা হলো (QR scan + live GPS location) ──
  mobile_scanner: ^5.2.3
  geolocator: ^13.0.1

  # ── Fees Due পেজে "QR দিয়ে Pay করুন" অপশনের জন্য নতুন যোগ করা হলো ──
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  # অটোমেটিক প্যাকেজ নাম পরিবর্তন করার জন্য প্লাগইনটি যুক্ত করা হলো
  change_app_package_name: ^1.4.0
  # ── App launcher icon (averroes_logo.png থেকে) জেনারেট করার জন্য নতুন যোগ করা হলো ──
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "Assets/wireframe_assets/wireframe_pngimage/app_launcher_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "Assets/wireframe_assets/wireframe_pngimage/app_launcher_icon_foreground.png"
  remove_alpha_ios: true


flutter:
  uses-material-design: true

  assets:
    - Assets/wireframe_assets/wireframe_pngimage/

  fonts:
    - family: SourceSansProBold
      fonts:
        - asset: Assets/wireframe_assets/wireframe_fonts/SourceSansPro-Bold.ttf
    - family: SourceSansProRegular
      fonts:
        - asset: Assets/wireframe_assets/wireframe_fonts/SourceSansPro-Regular.ttf
    - family: SourceSansProSemibold
      fonts:
        - asset: Assets/wireframe_assets/wireframe_fonts/SourceSansPro-Semibold.ttf